<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monolith · Data Centre Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' rx='3' fill='%23E8613C'/%3E%3Crect x='10' y='9' width='12' height='2' fill='white'/%3E%3Crect x='10' y='14' width='12' height='2' fill='white'/%3E%3Crect x='10' y='19' width='12' height='2' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/tokens.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader__mark"><span></span><span></span><span></span></div>
    <div class="loader__title">Monolith</div>
    <div class="loader__status" id="loader-status">Loading city model…</div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand__mark"><span></span><span></span><span></span></div>
        <div class="brand__name">Monolith</div>
        <div class="brand__sep"></div>
        <button class="project-pill" type="button">
          <span class="project-pill__dot"></span>Singapore DC Programme
        </button>
      </div>

      <form class="command" id="command-form" autocomplete="off">
        <span class="command__logo">✦</span>
        <input id="command-input" placeholder="Ask Monolith… e.g. “find a 60 MW site in the west”" />
        <div class="command__slot" id="command-slot"></div>
        <kbd>⌘K</kbd>
      </form>

      <nav class="stages" id="stage-nav">
        <button data-stage="site"><i>01</i>Site</button>
        <button data-stage="design"><i>02</i>Design</button>
        <button data-stage="review"><i>03</i>Review</button>
      </nav>

      <button class="btn btn--sm btn--ghost reset-btn" id="reset-btn" type="button" title="Reset demo (Shift+R)">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset
      </button>

      <div class="status" id="api-status" title="Gemini connection">
        <span class="status__dot"></span><span class="status__label">Gemini</span>
      </div>
    </header>

    <aside class="rail" id="rail">
      <button data-rail="layers" title="Layers"><svg viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg></button>
      <button data-rail="site" title="Sites"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
      <button data-rail="design" title="Design"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><rect x="5" y="9" width="6" height="12"/><rect x="13" y="4" width="6" height="17"/></svg></button>
      <button data-rail="review" title="Review"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
      <div class="rail__spacer"></div>
      <button data-rail="constellation" title="Agent constellation"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="1.6"/><circle cx="20" cy="5" r="1.6"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="19" r="1.6"/><path d="M5.3 6.2 9.7 10M18.7 6.2 14.3 10M5.3 17.8 9.7 14M18.7 17.8 14.3 14"/></svg></button>
    </aside>

    <section class="panel panel--left" id="left-panel"></section>

    <main class="stage" id="map-stage">
      <div id="map" class="map"></div>
      <div id="overlay" class="overlay"></div>
      <div id="layers-pop" class="card layers-pop" hidden></div>
      <div class="map-controls" id="map-controls"></div>
      <div class="legend card" id="legend"></div>
      <div class="attribution">© OpenStreetMap · OpenFreeMap · MapLibre</div>
    </main>

    <aside class="panel panel--right" id="right-panel"></aside>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="lightbox" class="lightbox" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
