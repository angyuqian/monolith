# Deploys the static app to GitHub Pages on every push to main.
# The Gemini key comes from the GEMINI_KEY repository secret and is written into config.local.js
# in the deployed copy only — it never appears in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folder (inject key from secret)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'scripts' ./ _site/
          touch _site/.nojekyll
          if [ -n "$GEMINI_KEY" ]; then
            printf "export default { GEMINI_KEY: '%s' };\n" "$GEMINI_KEY" > _site/config.local.js
          else
            echo "::warning::GEMINI_KEY secret not set — the site will ask visitors for a key"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
